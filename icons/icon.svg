<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#5b21b6" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Background with Neo-brutalist border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#0f172a" stroke-width="12" opacity="0.3" />

  <!-- Center Money Bill Graphic -->
  <g transform="translate(256, 256) scale(1.1)" filter="url(#shadow)">
    <!-- Shadow Card -->
    <rect x="-140" y="-85" width="280" height="170" rx="24" fill="#0f172a" />
    <!-- White Bill Base -->
    <rect x="-145" y="-90" width="280" height="170" rx="24" fill="#ecfdf5" stroke="#0f172a" stroke-width="8" />
    <!-- Inner Border Pattern -->
    <rect x="-132" y="-77" width="254" height="144" rx="16" fill="none" stroke="#10b981" stroke-width="4" stroke-dasharray="10 6" />

    <!-- Split Nodes Left & Right -->
    <circle cx="-90" cy="0" r="22" fill="#8b5cf6" stroke="#0f172a" stroke-width="6" />
    <text x="-90" y="7" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">₹</text>

    <circle cx="90" cy="0" r="22" fill="#ec4899" stroke="#0f172a" stroke-width="6" />
    <text x="90" y="7" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">$</text>

    <!-- Center Currency Emblem -->
    <circle cx="0" cy="0" r="42" fill="url(#coinGrad)" stroke="#0f172a" stroke-width="7" />
    <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#0f172a" text-anchor="middle">💸</text>
  </g>

  <!-- Split Connectors -->
  <path d="M 195 256 Q 256 220 317 256" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />
</svg>
